<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duel — Rock Paper Scissors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style >
  
</style>
</head>
<body>
<main>
  <h1>Rock, Paper, Scissors</h1>
  <p class="tagline" id="round-indicator">Round 1 of 5 — circle beats blade, blade cuts sheet, sheet covers stone.</p>

  <div class="scoreboard">
    <div class="score-side you">
      <div class="score-label">You</div>
      <div class="score-value" id="score-you">0</div>
    </div>
    <div class="score-mid">
      <div class="score-label">Draws</div>
      <div class="score-value" id="score-tie">0</div>
    </div>
    <div class="score-side cpu">
      <div class="score-label">Computer</div>
      <div class="score-value" id="score-cpu">0</div>
    </div>
  </div>

  <div class="arena">
    <div class="fighter">
      <div class="fighter-label">You</div>
      <div class="shape-slot" id="you-slot"></div>
    </div>
    <div class="vs">vs</div>
    <div class="fighter">
      <div class="fighter-label">Computer</div>
      <div class="shape-slot" id="cpu-slot"></div>
    </div>
  </div>

  <div class="status" id="status">Make your move</div>

  <div class="final-banner" id="final-banner" hidden>
    <div class="final-title" id="final-title"></div>
    <div class="final-sub">Final score — You <span id="final-you"></span> · Computer <span id="final-cpu"></span> · Draws <span id="final-draws"></span></div>
  </div>

  <div class="controls" id="controls">
    <button class="choice" data-choice="rock">
      <svg class="shape rock" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24"/></svg>
      Rock
    </button>
    <button class="choice" data-choice="paper">
      <svg class="shape paper" viewBox="0 0 56 56"><rect x="6" y="6" width="44" height="44"/></svg>
      Paper
    </button>
    <button class="choice" data-choice="scissors">
      <svg class="shape scissors" viewBox="0 0 56 56"><polygon points="28,4 52,50 4,50"/></svg>
      Scissors
    </button>
  </div>

  <footer>
    <button class="reset" id="reset" hidden>Play again</button>
  </footer>
</main>

<script>
  const SHAPES = {
    rock: '<svg class="shape rock" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24"/></svg>',
    paper: '<svg class="shape paper" viewBox="0 0 56 56"><rect x="6" y="6" width="44" height="44"/></svg>',
    scissors: '<svg class="shape scissors" viewBox="0 0 56 56"><polygon points="28,4 52,50 4,50"/></svg>',
    placeholder: '<svg class="shape placeholder" viewBox="0 0 56 56"><circle cx="28" cy="28" r="20"/></svg>'
  };
  const TOTAL_ROUNDS = 5;

  const youSlot = document.getElementById('you-slot');
  const cpuSlot = document.getElementById('cpu-slot');
  const statusEl = document.getElementById('status');
  const roundIndicator = document.getElementById('round-indicator');
  const buttons = document.querySelectorAll('button.choice');
  const controls = document.getElementById('controls');
  const resetBtn = document.getElementById('reset');
  const finalBanner = document.getElementById('final-banner');
  const finalTitle = document.getElementById('final-title');

  let scores = { you: 0, cpu: 0, draw: 0 };
  let round = 1;
  let matchOver = false;

  youSlot.innerHTML = SHAPES.placeholder;
  cpuSlot.innerHTML = SHAPES.placeholder;

  function renderScores() {
    document.getElementById('score-you').textContent = scores.you;
    document.getElementById('score-cpu').textContent = scores.cpu;
    document.getElementById('score-tie').textContent = scores.draw;
  }

  function setButtonsDisabled(disabled) {
    buttons.forEach(b => b.disabled = disabled);
  }

  function endMatch() {
    matchOver = true;
    controls.hidden = true;
    resetBtn.hidden = false;
    finalBanner.hidden = false;

    document.getElementById('final-you').textContent = scores.you;
    document.getElementById('final-cpu').textContent = scores.cpu;
    document.getElementById('final-draws').textContent = scores.draw;

    if (scores.you > scores.cpu) {
      finalTitle.textContent = 'Congratulations! You are the Champion!';
      finalTitle.className = 'final-title win';
    } else if (scores.you < scores.cpu) {
      finalTitle.textContent = 'Computer won the game!';
      finalTitle.className = 'final-title lose';
    } else {
      finalTitle.textContent = 'The game is a draw!';
      finalTitle.className = 'final-title tie';
    }
  }

  async function play(choice) {
    if (matchOver) return;
    setButtonsDisabled(true);
    statusEl.textContent = 'Thinking…';
    statusEl.className = 'status';

    try {
      const res = await fetch('/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ choice })
      });

      if (!res.ok) throw new Error('Server error');
      const data = await res.json();

      youSlot.innerHTML = SHAPES[data.you];
      cpuSlot.innerHTML = SHAPES[data.computer];
      youSlot.classList.remove('reveal'); void youSlot.offsetWidth; youSlot.classList.add('reveal');
      cpuSlot.classList.remove('reveal'); void cpuSlot.offsetWidth; cpuSlot.classList.add('reveal');

      if (data.result === 'win') {
        scores.you++;
        statusEl.textContent = 'Round ' + round + ': ' + data.you + ' beats ' + data.computer + ' — you win';
        statusEl.className = 'status win';
      } else if (data.result === 'lose') {
        scores.cpu++;
        statusEl.textContent = 'Round ' + round + ': ' + data.computer + ' beats ' + data.you + ' — computer wins';
        statusEl.className = 'status lose';
      } else {
        scores.draw++;
        statusEl.textContent = 'Round ' + round + ': both chose ' + data.you + ' — draw';
        statusEl.className = 'status tie';
      }
      renderScores();

      if (round >= TOTAL_ROUNDS) {
        endMatch();
      } else {
        round++;
        roundIndicator.textContent = 'Round ' + round + ' of ' + TOTAL_ROUNDS + ' — circle beats blade, blade cuts sheet, sheet covers stone.';
        setButtonsDisabled(false);
      }
    } catch (err) {
      statusEl.textContent = 'Something went wrong — try again';
      statusEl.className = 'status lose';
      setButtonsDisabled(false);
    }
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => play(btn.dataset.choice));
  });

  resetBtn.addEventListener('click', () => {
    scores = { you: 0, cpu: 0, draw: 0 };
    round = 1;
    matchOver = false;
    renderScores();
    roundIndicator.textContent = 'Round 1 of ' + TOTAL_ROUNDS + ' — circle beats blade, blade cuts sheet, sheet covers stone.';
    statusEl.textContent = 'Make your move';
    statusEl.className = 'status';
    youSlot.innerHTML = SHAPES.placeholder;
    cpuSlot.innerHTML = SHAPES.placeholder;
    controls.hidden = false;
    resetBtn.hidden = true;
    finalBanner.hidden = true;
    setButtonsDisabled(false);
  });
</script>
</body>
</html>
